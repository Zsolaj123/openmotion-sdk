# Hardware-free CI gate for openmotion-sdk.
#
# ⚠️ TO ACTIVATE: move this file to `.github/workflows/ci-offline.yml`.
#    Pushing a file under .github/workflows/ needs a GitHub token with the
#    `workflow` scope (a plain `repo` scope is refused), so it's shipped here
#    instead. Either `git mv` it into place from a machine whose token has the
#    `workflow` scope (`gh auth refresh -h github.com -s workflow`), or add it
#    via the GitHub web UI (Actions → new workflow → paste).
#
# Runs the full hardware-free test subset on a cloud runner — the existing
# hardware-tests.yml lanes only run on the self-hosted bench runner, so without
# this there is no cloud test gate.

name: Offline tests (hardware-free)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # setuptools_scm needs the full tag history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Hardware-free test suite
        # The full hardware-free subset (~469 tests); device-gated tests
        # (console/sensor/fpga/imu) self-skip without hardware.
        run: pytest tests/ -m "not destructive and not slow" -q
